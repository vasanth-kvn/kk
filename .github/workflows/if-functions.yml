name: if-with-functions
on: 
  push:
    branches: 
    - main
    - develop
    - feature
jobs:
  quality_check:
    if: startsWith(github.ref_name,'feature') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: perform code quality
        run: echo "performing quality checks on code"
  dev_deploy:
    if:  github.ref_name =='develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: perform code quality
        run: echo "deploying the on code on dev env"
  prod_deploy:
    if:  github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: perform code quality
        run: echo "deploying the on code on prod env"
  success_notification:
    needs: ['quality_check','dev_deploy','prod_deploy']
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - name: notify success
        run: echo "success mail sent to team"
  failure_notification:
    needs: ['quality_check','dev_deploy','prod_deploy']
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: notify success
    run: echo "failure mail sent to team"

