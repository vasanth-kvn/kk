name: build and deploy
on: 
  push:
    branches:
      - main
  pull_request:
    types: 
      - opened
      - synchronize
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: build
        run: echo "building application"
  test:
    runs-on: ubuntu-latest
    if: github.event_name =='push' && github.ref_name =='min'
    steps:
      - name: deploying
        run: echo "deploying application"
        
